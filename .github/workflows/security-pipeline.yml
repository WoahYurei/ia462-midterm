
name: Security CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    container-security:
        name: Docker Build, Trivy and Syft
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Build Docker Image
              run: docker build -t ia462-midterm:ci .

            - name: Trivy Vulnerability Scan
              uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
              with:
                  image-ref: 'ia462-midterm:ci'
                  format: 'table'
                  severity: 'CRITICAL,HIGH,MEDIUM'
                  exit-code: '0'
                  output: 'trivy-report.txt'

            - name: Generate Syft SBOM
              uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56
              with:
                  image: 'ia462-midterm:ci'
                  format: 'spdx-json'
                  output-file: 'sbom.spdx.json'
                  upload-artifact: false

            - name: Upload Security Reports
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: container-security-reports
                  path: |
                      trivy-report.txt
                      sbom.spdx.json

    dependency-audit:
        name: Python Dependency Audit (pip-audit)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

            - name: Set Up Python
              uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
              with:
                  python-version: '3.11'

            - name: Install pip-audit
              run: pip install pip-audit

            - name: Audit Python Dependencies
              run: pip-audit -r requirements.txt --strict

            - name: Audit Locked Dependencies
              run: pip-audit -r requirements.lock --strict
