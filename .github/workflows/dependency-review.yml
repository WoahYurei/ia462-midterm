
name: Dependency Review

on:
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    dependency-review:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

            - name: Dependency Review
              uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec
              with:
                  fail-on-severity: high
